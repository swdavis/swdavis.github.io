  <figcaption class="front">
    The research of our group is primarily focused on developing and applying computational tools to astrophysical systems. We specialize in methods for solving radiation transfer and radiation magnetohydrodynamics, and in post-processing simulations to produce spectra and images that can be compared directly with observations. Current research includes simulations of tidal disruption events, accretion onto black holes in X-ray binaries and supermassive black hole binaries, accretion disk winds, interactions between accretion disks and the stars and black holes embedded in them, X-ray bursts on neutron stars, and Lyman alpha radiation transfer in exoplanet atmospheres. See our <a href="/research.html">research page</a> for more details.
